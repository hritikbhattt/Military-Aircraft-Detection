name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight deps (no torch needed for these tests)
        run: pip install numpy opencv-python-headless matplotlib pyyaml
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  smoke-test-training:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install full requirements
        run: pip install -r requirements.txt
      - name: Generate synthetic dataset
        run: python data/generate_synthetic_samples.py --per-class 4
      - name: Train 1 epoch on synthetic data (pipeline smoke test, not a real model)
        run: python scripts/train.py --model yolov8n.pt --epochs 1 --batch 8 --imgsz 320 --device cpu --workers 2
      - name: Run detect.py on a synthetic sample
        run: |
          IMG=$(ls data/images/val/*.jpg | head -n 1)
          python scripts/detect.py --source "$IMG" --weights models/best.pt --conf 0.1
